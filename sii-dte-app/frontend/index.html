<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema DTE Chile - Emisión de Documentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #333;
            font-size: 2em;
        }

        header p {
            color: #666;
            margin-top: 5px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .document-list {
            list-style: none;
        }

        .document-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .document-info h3 {
            color: #333;
            font-size: 1.1em;
        }

        .document-info p {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-generado {
            background: #ffeeba;
            color: #856404;
        }

        .status-enviado {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Sistema DTE Chile</h1>
            <p>Emisión electrónica de facturas, boletas y documentos tributarios</p>
        </header>

        <!-- Estadísticas -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalDocumentos">0</div>
                <div class="stat-label">Total Documentos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalFacturas">0</div>
                <div class="stat-label">Facturas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalBoletas">0</div>
                <div class="stat-label">Boletas</div>
            </div>
        </div>

        <div class="dashboard">
            <!-- Formulario de Emisión -->
            <div class="card">
                <h2>🆕 Nuevo Documento</h2>
                <div id="mensajeAlerta" class="alert hidden"></div>
                
                <form id="formularioDTE">
                    <div class="form-group">
                        <label for="tipoDocumento">Tipo de Documento</label>
                        <select id="tipoDocumento" required>
                            <option value="33">Factura Electrónica (33)</option>
                            <option value="34">Factura No Afecta/Exenta (34)</option>
                            <option value="39">Boleta Electrónica (39)</option>
                            <option value="41">Boleta Exenta (41)</option>
                            <option value="52">Guía de Despacho (52)</option>
                            <option value="61">Nota de Crédito (61)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rutReceptor">RUT Receptor</label>
                        <input type="text" id="rutReceptor" placeholder="12345678-9" required>
                    </div>

                    <div class="form-group">
                        <label for="razonSocial">Razón Social</label>
                        <input type="text" id="razonSocial" placeholder="Nombre o razón social">
                    </div>

                    <div class="form-group">
                        <label for="montoNeto">Monto Neto ($)</label>
                        <input type="number" id="montoNeto" placeholder="0" min="0">
                    </div>

                    <div class="form-group">
                        <label for="giro">Giro</label>
                        <input type="text" id="giro" placeholder="Actividad comercial">
                    </div>

                    <button type="submit" class="btn">Generar Documento</button>
                </form>
            </div>

            <!-- Lista de Documentos -->
            <div class="card">
                <h2>📋 Documentos Generados</h2>
                <button onclick="cargarDocumentos()" class="btn btn-secondary" style="margin-bottom: 15px;">
                    🔄 Actualizar Lista
                </button>
                <ul class="document-list" id="listaDocumentos">
                    <li class="loading">Cargando documentos...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Elementos del DOM
        const formulario = document.getElementById('formularioDTE');
        const listaDocumentos = document.getElementById('listaDocumentos');
        const mensajeAlerta = document.getElementById('mensajeAlerta');

        // Cargar documentos al iniciar
        document.addEventListener('DOMContentLoaded', cargarDocumentos);

        // Manejar envío del formulario
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const datos = {
                tipo_documento: parseInt(document.getElementById('tipoDocumento').value),
                rut_receptor: document.getElementById('rutReceptor').value,
                razon_social_receptor: document.getElementById('razonSocial').value,
                monto_neto: parseFloat(document.getElementById('montoNeto').value) || 0,
                giro_receptor: document.getElementById('giro').value
            };

            // Calcular IVA y total
            datos.iva = Math.round(datos.monto_neto * 0.19);
            datos.monto_total = datos.monto_neto + datos.iva;

            try {
                const respuesta = await fetch(`${API_URL}/dte/generar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (resultado.success) {
                    mostrarAlerta(`✅ Documento generado exitosamente. Folio: ${resultado.folio}`, 'success');
                    formulario.reset();
                    cargarDocumentos();
                } else {
                    mostrarAlerta(`❌ Error: ${resultado.error}`, 'error');
                }
            } catch (error) {
                mostrarAlerta(`❌ Error de conexión: ${error.message}`, 'error');
            }
        });

        // Cargar lista de documentos
        async function cargarDocumentos() {
            try {
                const respuesta = await fetch(`${API_URL}/dte/listar`);
                const datos = await respuesta.json();

                actualizarEstadisticas(datos.documentos);
                renderizarLista(datos.documentos);
            } catch (error) {
                listaDocumentos.innerHTML = '<li class="loading">Error al cargar documentos</li>';
            }
        }

        // Renderizar lista de documentos
        function renderizarLista(documentos) {
            if (documentos.length === 0) {
                listaDocumentos.innerHTML = '<li class="loading">No hay documentos generados</li>';
                return;
            }

            listaDocumentos.innerHTML = documentos.map(doc => `
                <li class="document-item">
                    <div class="document-info">
                        <h3>${obtenerNombreTipo(doc.tipo)} - Folio ${doc.folio}</h3>
                        <p>RUT: ${doc.receptor} | Monto: $${doc.monto.toLocaleString()}</p>
                        <p>Fecha: ${new Date(doc.fecha).toLocaleDateString()}</p>
                    </div>
                    <div>
                        <span class="status-badge status-${doc.estado.toLowerCase()}">${doc.estado}</span>
                        ${doc.estado === 'GENERADO' ? `
                            <button onclick="enviarAlSII(${doc.id})" class="btn" style="padding: 5px 10px; margin-left: 10px; font-size: 12px;">
                                Enviar
                            </button>
                        ` : ''}
                    </div>
                </li>
            `).join('');
        }

        // Actualizar estadísticas
        function actualizarEstadisticas(documentos) {
            const total = documentos.length;
            const facturas = documentos.filter(d => d.tipo === 33 || d.tipo === 34).length;
            const boletas = documentos.filter(d => d.tipo === 39 || d.tipo === 41).length;

            document.getElementById('totalDocumentos').textContent = total;
            document.getElementById('totalFacturas').textContent = facturas;
            document.getElementById('totalBoletas').textContent = boletas;
        }

        // Enviar documento al SII
        async function enviarAlSII(dteId) {
            try {
                const respuesta = await fetch(`${API_URL}/dte/enviar/${dteId}`, {
                    method: 'POST'
                });

                const resultado = await respuesta.json();

                if (resultado.success) {
                    mostrarAlerta('✅ Documento enviado al SII', 'success');
                    cargarDocumentos();
                } else {
                    mostrarAlerta(`❌ Error: ${resultado.error}`, 'error');
                }
            } catch (error) {
                mostrarAlerta(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }

        // Mostrar alerta
        function mostrarAlerta(mensaje, tipo) {
            mensajeAlerta.textContent = mensaje;
            mensajeAlerta.className = `alert alert-${tipo}`;
            mensajeAlerta.classList.remove('hidden');

            setTimeout(() => {
                mensajeAlerta.classList.add('hidden');
            }, 5000);
        }

        // Obtener nombre del tipo de documento
        function obtenerNombreTipo(codigo) {
            const tipos = {
                33: 'Factura',
                34: 'Factura Exenta',
                39: 'Boleta',
                41: 'Boleta Exenta',
                52: 'Guía de Despacho',
                61: 'Nota de Crédito'
            };
            return tipos[codigo] || 'Documento';
        }
    </script>
</body>
</html>
